<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CIRDRIO — Diagnostic</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
padding:40px 20px;
font-family:Arial,Helvetica,sans-serif;
background:#faf9f7;
color:#151515;
}

.container{
max-width:900px;
margin:auto;
}

h1{
letter-spacing:5px;
margin-bottom:5px;
}

.status{
padding:18px;
margin:15px 0;
border:1px solid #ddd;
background:#fff;
border-radius:12px;
line-height:1.6;
}

.ok{
border-left:5px solid #16803c;
}

.error{
border-left:5px solid #c62828;
}

img{
width:300px;
height:350px;
object-fit:cover;
display:block;
margin:20px 0;
background:#eee;
border-radius:10px;
}

code{
display:block;
word-break:break-all;
background:#eee;
padding:12px;
margin-top:10px;
border-radius:6px;
}
</style>
</head>

<body>

<div class="container">

<h1>CIRDRIO</h1>
<p>Website Diagnostic</p>

<div id="connection" class="status">
Checking Supabase connection...
</div>

<div id="product" class="status">
Checking products table...
</div>

<div id="imageStatus" class="status">
Checking image...
</div>

<div id="result"></div>

</div>

<script>

const SUPABASE_URL =
"https://jbnatqugmajorwolsfin.supabase.co";

const SUPABASE_KEY =
"sb_publishable_NvC4LPhAESFhQJAVFFI_Q_Zam_C3-a";

const db = supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

async function diagnostic(){

const connectionBox =
document.getElementById("connection");

const productBox =
document.getElementById("product");

const imageBox =
document.getElementById("imageStatus");

const result =
document.getElementById("result");


// SUPABASE CHECK

try{

const {data,error} = await db
.from("products")
.select("id")
.limit(1);

if(error){

connectionBox.className="status error";

connectionBox.innerHTML =
"❌ SUPABASE ERROR<br><code>"
+ error.message +
"</code>";

return;

}

connectionBox.className="status ok";

connectionBox.innerHTML =
"✅ SUPABASE CONNECTION WORKING";

}catch(error){

connectionBox.className="status error";

connectionBox.innerHTML =
"❌ CONNECTION FAILED<br><code>"
+ error.message +
"</code>";

return;

}


// PRODUCT CHECK

try{

const {data,error} = await db
.from("products")
.select("*")
.eq("name","CIRDRIO Glow Serum")
.limit(1);

if(error){

productBox.className="status error";

productBox.innerHTML =
"❌ PRODUCT QUERY ERROR<br><code>"
+ error.message +
"</code>";

return;

}

if(!data || data.length===0){

productBox.className="status error";

productBox.innerHTML =
"❌ CIRDRIO Glow Serum NOT FOUND";

return;

}

const product=data[0];

productBox.className="status ok";

productBox.innerHTML =
"✅ PRODUCT FOUND<br><br>" +

"<b>Name:</b> " +
(product.name || "EMPTY") +

"<br><b>Category:</b> " +
(product.category || "EMPTY") +

"<br><b>Price:</b> ₹" +
(product.price || "EMPTY") +

"<br><b>Image URL:</b>";

const url=document.createElement("code");

url.textContent =
product.image_url || "EMPTY";

productBox.appendChild(url);


// IMAGE CHECK

const image=document.createElement("img");

image.src =
product.image_url;

image.alt =
product.name || "CIRDRIO Product";

image.onload=function(){

imageBox.className="status ok";

imageBox.innerHTML =
"✅ IMAGE LOADED SUCCESSFULLY";

result.appendChild(image);

};

image.onerror=function(){

imageBox.className="status error";

imageBox.innerHTML =
"❌ IMAGE FAILED TO LOAD";

result.appendChild(image);

};

}catch(error){

productBox.className="status error";

productBox.innerHTML =
"❌ PRODUCT CHECK FAILED<br><code>"
+ error.message +
"</code>";

}

}

diagnostic();

</script>

</body>
</html>
