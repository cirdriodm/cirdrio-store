<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CIRDRIO — Diagnostic</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:40px 20px;
  font-family:Arial,Helvetica,sans-serif;
  background:#faf9f7;
  color:#151515;
}
.container{max-width:900px;margin:auto}
h1{letter-spacing:4px}
.status{
  padding:16px;
  margin:12px 0;
  border:1px solid #ddd;
  background:white;
  border-radius:10px;
}
.ok{border-left:5px solid #16803c}
.error{border-left:5px solid #c62828}
img{
  width:300px;
  height:350px;
  object-fit:cover;
  display:block;
  margin-top:20px;
  background:#eee;
}
code{
  display:block;
  word-break:break-all;
  background:#eee;
  padding:12px;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>CIRDRIO</h1>
<p>Website Diagnostic</p>

<div id="connection" class="status">
Checking Supabase connection...
</div>

<div id="product" class="status">
Checking products table...
</div>

<div id="imageStatus" class="status">
Checking image...
</div>

<div id="result"></div>

</div>

<script>

const SUPABASE_URL =
"https://jbnatqugmajorwolsfin.supabase.co";

const SUPABASE_KEY =
"sb_publishable_NvC4LPhAESFhQJAVFFI_Q_Zam_C3-a";

const IMAGE_URL =
"https://jbnatqugmajorwolsfin.supabase.co/storage/v1/object/public/product-images/file_00000000429c8211b976e9c3f5754e12.png";

const db = supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

async function diagnostic(){

const connectionBox =
document.getElementById("connection");

const productBox =
document.getElementById("product");

const imageBox =
document.getElementById("imageStatus");

const result =
document.getElementById("result");


// 1. SUPABASE CONNECTION

try{

const {data,error} = await db
.from("products")
.select("id")
.limit(1);

if(error){

connectionBox.className="status error";

connectionBox.innerHTML =
"❌ SUPABASE CONNECTION / RLS ERROR<br><code>"
+ error.message +
"</code>";

}else{

connectionBox.className="status ok";

connectionBox.innerHTML =
"✅ SUPABASE CONNECTION WORKING";

}

}catch(e){

connectionBox.className="status error";

connectionBox.innerHTML =
"❌ CONNECTION FAILED<br><code>"
+ e.message +
"</code>";

}


// 2. PRODUCT DATA

try{

const {data,error} = await db
.from("products")
.select("*")
.eq("name","CIRDRIO Glow Serum")
.limit(1);

if(error){

productBox.className="status error";

productBox.innerHTML =
"❌ PRODUCT QUERY ERROR<br><code>"
+ error.message +
"</code>";

return;
}

if(!data || data.length===0){

productBox.className="status error";

productBox.innerHTML =
"❌ CIRDRIO Glow Serum NOT FOUND";

return;
}

const product=data[0];

productBox.className="status ok";

productBox.innerHTML =
"✅ PRODUCT FOUND<br><br>" +

"<b>Name:</b> "+
(product.name || "EMPTY") +

"<br><b>Category:</b> "+
(product.category || "EMPTY") +

"<br><b>Price:</b> "+
(product.price || "EMPTY") +

"<br><b>Image URL:</b>";

const url=document.createElement("code");

url.textContent =
product.image_url || "EMPTY";

productBox.appendChild(url);


// 3. IMAGE URL

const image =
document.createElement("img");

image.src =
product.image_url || IMAGE_URL;

image.alt =
product.name || "CIRDRIO";

image.onload=function(){

imageBox.className="status ok";

imageBox.innerHTML =
"✅ IMAGE LOADED SUCCESSFULLY";

result.appendChild(image);

};

image.onerror=function(){

imageBox.className="status error";

imageBox.innerHTML =
"❌ IMAGE FAILED TO LOAD";

result.appendChild(image);

};

}catch(e){

productBox.className="status error";

productBox.innerHTML =
"❌ PRODUCT CHECK FAILED<br><code>"
+ e.message +
"</code>";

}

}

diagnostic();

</script>

</body>
</html>
