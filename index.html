<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CIRDRIO — Diagnostic</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
margin:0;
padding:24px;
min-height:100vh;
background:#f7f5f1;
font-family:Arial,sans-serif;
color:#171717;
display:flex;
align-items:center;
justify-content:center
}
.card{
width:100%;
max-width:650px;
background:#fff;
border:1px solid #e5e2dc;
border-radius:20px;
padding:32px;
box-shadow:0 15px 45px rgba(0,0,0,.08)
}
.logo{
font-size:30px;
font-weight:800;
letter-spacing:4px
}
.sub{
margin-top:7px;
color:#777;
font-size:15px
}
.box{
margin-top:22px;
padding:18px;
border:1px solid #e5e2dc;
border-radius:14px;
background:#fafafa;
line-height:1.7;
word-break:break-word
}
.ok{border-left:5px solid #16803c}
.err{border-left:5px solid #c62828}
.wait{border-left:5px solid #996c00}
img{
display:block;
width:220px;
max-width:100%;
margin:18px auto 0;
border-radius:14px
}
</style>
</head>

<body>

<div class="card">

<div class="logo">CIRDRIO</div>
<div class="sub">Supabase Connection Diagnostic</div>

<div id="connection" class="box wait">
⏳ Checking Supabase connection...
</div>

<div id="product" class="box wait">
⏳ Checking product...
</div>

<div id="image" class="box wait">
⏳ Checking image...
</div>

</div>

<script>

const SUPABASE_URL =
"https://jbnatqugmajorwolsfin.supabase.co";

const SUPABASE_KEY =
"sb_publishable_l7tBbN22fFYgPv5bmkEPtw_Di-XHpsY";

const db = supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


// SUPABASE + PRODUCTS TEST
async function test(){

const connection =
document.getElementById("connection");

const productBox =
document.getElementById("product");

const imageBox =
document.getElementById("image");


// DIRECT PRODUCTS QUERY
const {data,error} = await db
.from("products")
.select("name,description,price,category,image_url,stock")
.limit(10);


if(error){

connection.className="box err";

connection.innerHTML=
"❌ SUPABASE ERROR<br><br>"+
error.message;

productBox.className="box err";

productBox.innerHTML=
"⏸ Product test stopped.";

imageBox.className="box err";

imageBox.innerHTML=
"⏸ Image test stopped.";

return;
}


// CONNECTION SUCCESS
connection.className="box ok";

connection.innerHTML=
"✅ SUPABASE CONNECTED<br>"+
"✅ PRODUCTS TABLE ACCESSIBLE";


// NO PRODUCTS
if(!data || data.length===0){

productBox.className="box err";

productBox.innerHTML=
"❌ PRODUCTS TABLE EMPTY<br><br>"+
"No product found.";

imageBox.className="box wait";

imageBox.innerHTML=
"⏸ Image test stopped.";

return;
}


// FIND GLOW SERUM
const product =
data.find(p =>
p.name === "CIRDRIO Glow Serum"
) || data[0];


productBox.className="box ok";

productBox.innerHTML=
"<strong>✅ PRODUCT FOUND</strong><br><br>"+
"<b>Name:</b> "+(product.name||"—")+"<br>"+
"<b>Price:</b> ₹"+(product.price||"—")+"<br>"+
"<b>Category:</b> "+(product.category||"—")+"<br>"+
"<b>Stock:</b> "+(product.stock??"—")+"<br>"+
"<b>Image URL:</b><br>"+
(product.image_url||"EMPTY");


// IMAGE TEST
if(!product.image_url){

imageBox.className="box err";

imageBox.innerHTML=
"❌ IMAGE URL EMPTY";

return;
}

const img =
document.createElement("img");

img.src=product.image_url;

img.onload=function(){

imageBox.className="box ok";

imageBox.innerHTML=
"✅ IMAGE LOADED SUCCESSFULLY";

imageBox.appendChild(img);

};

img.onerror=function(){

imageBox.className="box err";

imageBox.innerHTML=
"❌ IMAGE FAILED TO LOAD<br><br>"+
product.image_url;

};

}

test();

</script>

</body>
</html>
