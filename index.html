<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIRDRIO — System Diagnostic</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:#f7f5f1;
  color:#171717;
  font-family:Arial,Helvetica,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

.card{
  width:100%;
  max-width:650px;
  background:#fff;
  border:1px solid #e5e2dc;
  border-radius:20px;
  padding:32px;
  box-shadow:0 15px 45px rgba(0,0,0,.08);
}

.logo{
  font-size:28px;
  font-weight:800;
  letter-spacing:3px;
}

.subtitle{
  margin-top:6px;
  color:#777;
  font-size:14px;
}

.status{
  margin-top:25px;
  padding:16px;
  border-radius:12px;
  background:#f5f5f5;
  font-weight:600;
}

.ok{color:#16803c}
.error{color:#c62828}
.wait{color:#996c00}

.result{
  margin-top:15px;
  padding:18px;
  border:1px solid #e7e4de;
  border-radius:14px;
  background:#fafafa;
  line-height:1.7;
  word-break:break-word;
}

img{
  display:block;
  width:220px;
  max-width:100%;
  margin:20px auto 5px;
  border-radius:14px;
  border:1px solid #ddd;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">CIRDRIO</div>
  <div class="subtitle">Supabase Connection Diagnostic</div>

  <div id="connection" class="status wait">
    ⏳ Checking Supabase connection...
  </div>

  <div id="product" class="result">
    ⏳ Checking product...
  </div>

  <div id="imageBox" class="result">
    ⏳ Checking product image...
  </div>

</div>

<script>

const SUPABASE_URL =
"https://jbnatqugmajorwolsfin.supabase.co";

const SUPABASE_KEY =
"sb_publishable_l7tBbN22fFYgPv5bmkEPtw_Di-XHpsY";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


// 1. CHECK SUPABASE
async function checkConnection(){

  const box = document.getElementById("connection");

  const { data, error } = await db
    .from("products")
    .select("id")
    .limit(1);

  if(error){

    box.className = "status error";

    box.innerHTML =
      "❌ SUPABASE ERROR<br><small>" +
      error.message +
      "</small>";

    return false;
  }

  box.className = "status ok";
  box.innerHTML = "✅ SUPABASE CONNECTED";

  return true;
}


// 2. CHECK PRODUCT
async function checkProduct(){

  const box = document.getElementById("product");

  const { data, error } = await db
    .from("products")
    .select("*")
    .eq("name","CIRDRIO Glow Serum")
    .limit(1);

  if(error){

    box.innerHTML =
      "❌ PRODUCT ERROR<br>" +
      error.message;

    return;
  }

  if(!data || data.length === 0){

    box.innerHTML =
      "❌ PRODUCT NOT FOUND<br>" +
      "CIRDRIO Glow Serum database me nahi mila.";

    return;
  }

  const product = data[0];

  box.innerHTML =
    "<strong>✅ PRODUCT FOUND</strong><br><br>" +
    "<b>Name:</b> " + product.name + "<br>" +
    "<b>Price:</b> ₹" + product.price + "<br>" +
    "<b>Category:</b> " + product.category + "<br>" +
    "<b>Stock:</b> " + product.stock + "<br><br>" +
    "<b>Image URL:</b><br>" +
    product.image_url;

  checkImage(product.image_url);
}


// 3. CHECK IMAGE
function checkImage(url){

  const box = document.getElementById("imageBox");

  if(!url){

    box.innerHTML =
      "❌ IMAGE URL EMPTY";

    return;
  }

  const image = document.createElement("img");

  image.src = url;

  image.onload = function(){

    box.innerHTML =
      "✅ IMAGE LOADED SUCCESSFULLY";

    box.appendChild(image);
  };

  image.onerror = function(){

    box.innerHTML =
      "❌ IMAGE FAILED TO LOAD<br><br>" +
      "<small>" + url + "</small>";
  };
}


// START
(async function(){

  const connected = await checkConnection();

  if(connected){
    await checkProduct();
  }else{
    document.getElementById("product").innerHTML =
      "⏸ Product check stopped because Supabase connection failed.";

    document.getElementById("imageBox").innerHTML =
      "⏸ Image check stopped.";
  }

})();

</script>

</body>
</html>
